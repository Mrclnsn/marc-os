services:
  db:
    # Postgres 17 met pgvector (semantisch zoeken in de second brain)
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: marcos
      POSTGRES_USER: marcos
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?zet POSTGRES_PASSWORD in .env}
      TZ: Europe/Amsterdam
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marcos -d marcos"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Geen poort naar buiten: alleen bereikbaar voor de app

  migrate:
    build:
      context: .
      target: tools
    env_file: .env
    environment:
      DATABASE_URL: postgres://marcos:${POSTGRES_PASSWORD}@db:5432/marcos
    command: ["npx", "tsx", "scripts/migrate.ts"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  app:
    build:
      context: .
      target: runner
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://marcos:${POSTGRES_PASSWORD}@db:5432/marcos
      BACKUP_DIR: /backups
    volumes:
      # Versleutelde back-ups, alleen lezen: de Mac haalt ze op via /api/export/backup
      - ./backups:/backups:ro
    depends_on:
      migrate:
        condition: service_completed_successfully

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?zet DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app

volumes:
  db-data:
  caddy-data:
  caddy-config:
