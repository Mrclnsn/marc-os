services:
  db:
    # Postgres 17 met pgvector (semantisch zoeken in de second brain)
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: marcos
      POSTGRES_USER: marcos
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?zet POSTGRES_PASSWORD in .env}
      TZ: Europe/Amsterdam
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marcos -d marcos"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Geen poort naar buiten: alleen bereikbaar voor de app

  migrate:
    build:
      context: .
      target: tools
    env_file: .env
    environment:
      DATABASE_URL: postgres://marcos:${POSTGRES_PASSWORD}@db:5432/marcos
    command: ["npx", "tsx", "scripts/migrate.ts"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  app:
    build:
      context: .
      target: runner
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://marcos:${POSTGRES_PASSWORD}@db:5432/marcos
      BACKUP_DIR: /backups
    volumes:
      # Versleutelde back-ups, alleen lezen: de Mac haalt ze op via /api/export/backup
      - ./backups:/backups:ro
    depends_on:
      migrate:
        condition: service_completed_successfully

  # Hermes (gesprek 12): de AI-assistent, naast de app. Alleen intern bereikbaar (geen poorten naar buiten).
  # Staat aan met COMPOSE_PROFILES=hermes in .env (zet scripts/hermes-setup.sh).
  hermes:
    image: nousresearch/hermes-agent:${HERMES_IMAGE_TAG:-stable}
    profiles: ["hermes"]
    restart: unless-stopped
    command: ["gateway", "run"]
    # Bewust geen env_file: Hermes krijgt alleen zijn eigen sleutels, niet die van de database of de app
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      API_SERVER_ENABLED: "true"
      API_SERVER_HOST: 0.0.0.0
      API_SERVER_PORT: "8642"
      API_SERVER_KEY: ${HERMES_API_KEY:-}
      API_SERVER_MODEL_NAME: hermes-agent
      # Eigen MCP-sleutel: lezen direct, wijzigen alleen als voorstel in de akkoordwachtrij
      MARC_OS_MCP_TOKEN: ${HERMES_MCP_TOKEN:-}
      # WhatsApp (gesprek 13, scripts/whatsapp-setup.sh): ingebouwde koppeling in bot-modus op een apart nummer.
      # Alleen Marc's eigen nummer mag praten (allowlist); de home-chat is waar routines naartoe gaan.
      WHATSAPP_ENABLED: ${HERMES_WHATSAPP:-false}
      WHATSAPP_MODE: bot
      WHATSAPP_ALLOWED_USERS: ${WHATSAPP_NUMBER:-}
      WHATSAPP_HOME_CHANNEL: ${WHATSAPP_HOME_CHANNEL:-}
      # Uitgaande berichten van Marc OS (alleen intern, ondertekend)
      WEBHOOK_ENABLED: ${HERMES_WHATSAPP:-false}
      WEBHOOK_SECRET: ${HERMES_WEBHOOK_SECRET:-}
      # Sleutel van de akkoord-plugin ("ja"/"nee" naar Marc OS); het model zelf heeft geen tools om hem te gebruiken
      MARC_OS_WHATSAPP_TOKEN: ${WHATSAPP_APPROVE_TOKEN:-}
      TZ: Europe/Amsterdam
    volumes:
      # Geheugen, gesprekken, config.yaml en SOUL.md (gevuld door scripts/hermes-config.sh)
      - ./hermes-data:/opt/data
    depends_on:
      - app
    deploy:
      resources:
        limits:
          memory: 2G

  # Spraak naar tekst voor Hermes (gesprek 13): faster-whisper op de VPS zelf, geen externe dienst.
  # Eigen container omdat de Hermes-image faster-whisper niet meelevert. Alleen intern (http://stt:8000).
  stt:
    build: ./stt
    profiles: ["hermes"]
    restart: unless-stopped
    environment:
      STT_MODEL: ${STT_MODEL:-small}
      STT_LANGUAGE: nl
      STT_THREADS: "2"
      STT_API_KEY: ${STT_API_KEY:-}
    volumes:
      # Het model (ca. 500 MB) wordt bij de eerste start opgehaald en hier bewaard
      - stt-models:/models
    deploy:
      resources:
        limits:
          memory: 2G

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?zet DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app

volumes:
  db-data:
  stt-models:
  caddy-data:
  caddy-config:
